/* LOGIN */
.login-screen{
  position:relative;z-index:5;
  min-height:100vh;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:40px 20px;
}
.brand{display:flex;align-items:center;justify-content:center;margin-bottom:6px;}
.brand img{
  height:140px;width:auto;
  filter:drop-shadow(0 0 18px rgba(181,101,255,.35));
}
.brand-fallback{font-size:64px;line-height:1;}
h1{display:none;}
.subtitle{
  color:var(--accent-light);margin-bottom:32px;font-size:18px;
  font-family:'Roboto Condensed',system-ui,sans-serif;
  letter-spacing:.5px;text-align:center;
}
.login-card{
  width:100%;max-width:380px;
  background:var(--bg-card);
  border:1px solid rgba(181,101,255,.25);
  border-radius:var(--radius);
  backdrop-filter:blur(10px);
  padding:28px 24px;
  display:flex;flex-direction:column;gap:16px;
}
.login-card h2{font-size:15px;font-weight:600;color:var(--text);}
.field{display:flex;flex-direction:column;gap:6px;}
.field label{font-size:12px;color:rgba(181,101,255,.7);letter-spacing:.04em;text-transform:uppercase;}
.field input{
  background:rgba(181,101,255,.07);
  border:1px solid rgba(181,101,255,.2);
  border-radius:8px;padding:11px 14px;
  font-size:14px;color:var(--text);
  font-family:'Segoe UI',system-ui,sans-serif;
  outline:none;transition:border-color .2s,box-shadow .2s;width:100%;
}
.field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(181,101,255,.15);}
.field input::placeholder{color:rgba(240,230,255,.3);}
.btn-login{
  width:100%;padding:12px;
  background:linear-gradient(135deg,var(--accent-dark),var(--accent));
  border:none;border-radius:8px;
  color:#fff;font-size:14px;font-weight:600;cursor:pointer;
  font-family:'Segoe UI',system-ui,sans-serif;
  letter-spacing:.04em;
  box-shadow:0 4px 20px rgba(181,101,255,.3);
  transition:opacity .2s,transform .1s;margin-top:4px;
}
.btn-login:hover{opacity:.88;}
.btn-login:active{transform:scale(0.98);}
.btn-login:disabled{opacity:.45;cursor:default;}
.login-error{font-size:12px;color:#ff6b6b;text-align:center;display:none;}
.login-error.visible{display:block;}
.login-help{
  font-size:12px;color:rgba(181,101,255,.55);
  text-align:center;margin-top:16px;line-height:1.6;
}
.login-help a{color:var(--accent);text-decoration:none;font-weight:500;}
.login-help a:hover{color:var(--accent-light);}

/* DASHBOARD */
.dashboard-screen{display:none;position:relative;z-index:5;}
.dashboard-screen.visible{display:block;}
main{max-width:1200px;margin:0 auto;padding:10px 16px 60px;}

/* header */
.dash-header{padding:28px 16px 20px;text-align:center;position:relative;max-width:1200px;margin:0 auto;}
.btn-logout{
  position:absolute;top:28px;right:16px;
  background:rgba(181,101,255,.08);
  border:1px solid rgba(181,101,255,.2);
  border-radius:8px;padding:7px 12px;cursor:pointer;
  color:rgba(181,101,255,.7);font-size:11px;font-weight:600;
  font-family:'Roboto Condensed',system-ui,sans-serif;
  letter-spacing:.08em;text-transform:uppercase;
  transition:color .2s,background .2s;
  display:flex;align-items:center;gap:5px;
}
.btn-logout:hover{color:var(--text);background:rgba(181,101,255,.15);}
.dash-logo-wrap{display:flex;align-items:center;justify-content:center;margin-bottom:6px;}
.dash-logo-wrap img{
  height:120px;width:auto;
  filter:drop-shadow(0 0 18px rgba(181,101,255,.32));
  display:none;
}
.dash-logo-wrap img.visible{display:block;}
.dash-emoji{font-size:56px;line-height:1;}
.dash-brand{font-size:20px;font-weight:700;color:var(--text);margin-bottom:4px;}
.dash-tagline{
  font-size:15px;color:var(--accent-light);
  font-family:'Roboto Condensed',system-ui,sans-serif;
  letter-spacing:.5px;margin-bottom:10px;
}
.dash-user-pill{
  display:inline-flex;align-items:center;gap:8px;
  background:rgba(181,101,255,.08);
  border:1px solid rgba(181,101,255,.18);
  border-radius:100px;padding:5px 14px 5px 7px;
  margin-top:8px;
}
.dash-user-avatar{
  width:26px;height:26px;border-radius:50%;
  background:linear-gradient(135deg,var(--accent-dark),var(--accent));
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;color:#fff;flex-shrink:0;
}
.dash-user-name{font-size:12px;color:rgba(181,101,255,.8);font-weight:500;}

/* section titles */
.section-title{
  font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;
  color:var(--accent-light);
  text-shadow:0 0 8px rgba(181,101,255,.5);
  margin:24px 0 14px;
  border-left:3px solid var(--accent);
  padding-left:10px;
}
#fav-section{display:none;}
#fav-section .section-title{color:#f5c518;text-shadow:0 0 8px rgba(245,197,24,.4);border-color:#f5c518;}

/* grid */
.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:16px;
}
@media(min-width:480px){.grid{grid-template-columns:repeat(3,1fr);}}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr);}}
@media(min-width:900px){.grid{grid-template-columns:repeat(5,1fr);}}

/* cards */
.card{
  background:var(--bg-card);
  border:1px solid rgba(181,101,255,.25);
  border-radius:var(--radius);
  display:flex;flex-direction:column;overflow:hidden;
  backdrop-filter:blur(10px);
  transition:transform .2s,box-shadow .2s,border-color .2s;
}
.card:hover{
  transform:translateY(-4px) scale(1.025);
  box-shadow:0 8px 32px rgba(181,101,255,.35),0 0 0 1px rgba(181,101,255,.5);
  border-color:var(--accent);
}
.card-body{
  flex:1;display:flex;align-items:center;justify-content:center;
  min-height:110px;padding:16px 12px 10px;position:relative;
}
.panel-logo{max-width:100%;max-height:80px;object-fit:contain;display:block;}
.panel-letter{
  font-size:2.2rem;font-weight:800;color:var(--accent);
  text-shadow:0 0 18px rgba(181,101,255,.4);
}
.star-btn{
  position:absolute;top:7px;right:8px;
  background:none;border:none;cursor:pointer;
  font-size:15px;line-height:1;color:rgba(240,230,255,.35);
  padding:2px 4px;transition:color .15s,transform .15s;
  -webkit-tap-highlight-color:transparent;
}
.star-btn:hover{transform:scale(1.2);}
.star-btn.fav{color:#f5c518;}
.card-footer{
  padding:10px 12px 12px;
  border-top:1px solid rgba(181,101,255,.12);
  display:flex;flex-direction:column;gap:8px;
}
.name{
  font-size:.8rem;font-weight:700;letter-spacing:.06em;
  color:var(--accent-light);text-align:center;
}
.btn-access{
  width:100%;padding:9px;
  background:linear-gradient(135deg,var(--accent-dark),var(--accent));
  border:none;border-radius:8px;color:#fff;
  font-size:.78rem;font-weight:600;cursor:pointer;
  letter-spacing:.04em;
  transition:opacity .15s,transform .1s;
  font-family:'Segoe UI',system-ui,sans-serif;
}
.btn-access:hover{opacity:.88;transform:scale(1.03);}

.empty-state{
  text-align:center;padding:48px 24px;
  color:rgba(181,101,255,.4);font-size:13px;
  grid-column:1/-1;
}
.empty-state-icon{font-size:40px;margin-bottom:12px;}

footer{
  position:relative;z-index:5;text-align:center;
  padding:20px;font-size:.7rem;
  color:rgba(181,101,255,.4);letter-spacing:.08em;
  font-family:'Roboto Condensed',system-ui,sans-serif;
}

/* loading */
.loading-screen{
  position:fixed;inset:0;background:#0a0014;
  display:flex;align-items:center;justify-content:center;
  z-index:999;transition:opacity .3s;
}
.loading-screen.hidden{opacity:0;pointer-events:none;}
.spinner{
  width:32px;height:32px;
  border:3px solid rgba(181,101,255,.15);
  border-top-color:var(--accent);
  border-radius:50%;
  animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}

/* toast */
.toast{
  position:fixed;bottom:24px;left:50%;
  transform:translateX(-50%) translateY(80px);
  background:#1a0933;border:1px solid rgba(181,101,255,.25);
  border-radius:100px;padding:10px 20px;font-size:13px;
  color:var(--text);font-weight:500;
  box-shadow:0 8px 30px rgba(0,0,0,.5);
  opacity:0;transition:transform .3s cubic-bezier(.34,1.56,.64,1),opacity .3s;
  z-index:998;white-space:nowrap;
}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1;}
</style>
</head>
<body>

<div class="loading-screen" id="loading"><div class="spinner"></div></div>

<!-- LOGIN -->
<div class="login-screen" id="login-screen">
  <div class="brand">
    <img id="login-logo-img" src="" alt="" style="display:none"/>
    <span class="brand-fallback" id="login-emoji">📺</span>
  </div>
  <div class="subtitle" id="login-tagline">Entretenimento sem limites</div>

  <div class="login-card">
    <h2>Entrar na sua conta</h2>
    <div class="field">
      <label>E-mail</label>
      <input type="email" id="input-email" placeholder="seuemail@exemplo.com" autocomplete="email"/>
    </div>
    <div class="field">
      <label>Senha</label>
      <input type="password" id="input-password" placeholder="••••••••" autocomplete="current-password"/>
    </div>
    <div class="login-error" id="login-error">E-mail ou senha incorretos. Tente novamente.</div>
    <button class="btn-login" id="btn-login">Entrar</button>
  </div>

  <div class="login-help">
    Esqueceu sua senha? Fale com o<br>
    <a href="#" id="suporte-link">suporte via WhatsApp</a>
  </div>
</div>

<!-- DASHBOARD -->
<div class="dashboard-screen" id="dashboard-screen">
  <div class="dash-header">
    <button class="btn-logout" id="btn-logout">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
        <polyline points="16 17 21 12 16 7"/>
        <line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
      Sair
    </button>
    <div class="dash-logo-wrap">
      <img id="dash-logo-img" src="" alt=""/>
      <span class="dash-emoji" id="dash-emoji">📺</span>
    </div>
    <div class="dash-brand" id="dash-brand">Stream Plus</div>
    <div class="dash-tagline" id="dash-tagline">Entretenimento sem limites</div>
    <div class="dash-user-pill">
      <div class="dash-user-avatar" id="dash-user-avatar">C</div>
      <span class="dash-user-name" id="dash-user-name">cliente@email.com</span>
    </div>
  </div>

  <main>
    <div id="fav-section">
      <div class="section-title">⭐ Favoritos</div>
      <div class="grid" id="fav-grid"></div>
    </div>
    <div class="section-title">Acesso rápido</div>
    <div class="grid" id="icons-grid"></div>
  </main>

  <footer>INFINITY STREAM TV © <span id="year"></span></footer>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  const SUPABASE_URL = 'https://hxptaygjtvyyteyqlpeb.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh4cHRheWdqdHZ5eXRleXFscGViIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEwNzAxNjEsImV4cCI6MjEwNjY0NjE2MX0.dYAIcixEYEUuxfeFUmoOqTNX0MoO17yKfEdz6K4wZL0';
  const FAV_KEY = 'infinity_client_favs';

  document.getElementById('year').textContent = new Date().getFullYear();

  async function sbFetch(path, options={}) {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
      headers: { 'apikey':SUPABASE_KEY, 'Authorization':`Bearer ${SUPABASE_KEY}`, 'Content-Type':'application/json', ...(options.headers||{}) },
      ...options
    });
    if (!res.ok) { const e=await res.json().catch(()=>({})); throw new Error(e.message||`HTTP ${res.status}`); }
    const t=await res.text(); return t?JSON.parse(t):null;
  }

  let config = {
    revendedorId:null, brandName:'Stream Plus', tagline:'Entretenimento sem limites',
    logoUrl:null, colorBg:'#0a0014', colorAccent:'#b565ff',
    bgType:'solid', bgImageUrl:null, suporteUrl:'#', icons:[]
  };

  function getFavs(){ try{return JSON.parse(localStorage.getItem(FAV_KEY)||'[]');}catch{return[];} }
  function saveFavs(f){ localStorage.setItem(FAV_KEY,JSON.stringify(f)); }
  function isFav(label){ return getFavs().includes(label); }
  function toggleFav(label){
    const favs=getFavs(), idx=favs.indexOf(label);
    if(idx>=0) favs.splice(idx,1); else favs.push(label);
    saveFavs(favs); renderIcons();
  }

  function hexToRgb(h){
    h=h.replace('#','');
    if(h.length===3) h=h.split('').map(c=>c+c).join('');
    return `${parseInt(h.slice(0,2),16)},${parseInt(h.slice(2,4),16)},${parseInt(h.slice(4,6),16)}`;
  }
  function getSlug(){
    const p=new URLSearchParams(window.location.search);
    if(p.get('r')) return p.get('r');
    const parts=window.location.pathname.split('/').filter(Boolean);
    const last=parts[parts.length-1];
    return(last&&last!=='cliente')?last:'stream-plus';
  }
  function showToast(msg,d){
    const t=document.getElementById('toast');
    t.textContent=msg; t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'),d||2500);
  }

  async function carregarWhiteLabel(){
    const slug=getSlug();
    try {
      const data=await sbFetch(`revendedores?slug=eq.${encodeURIComponent(slug)}&ativo=eq.true&limit=1`);
      if(!data||data.length===0) throw new Error('Revendedor não encontrado');
      const r=data[0];
      config.revendedorId=r.id; config.brandName=r.nome_marca||'Minha Área';
      config.tagline=r.tagline||''; config.logoUrl=r.logo_url||null;
      config.colorBg=r.cor_fundo||'#0a0014'; config.colorAccent=r.cor_destaque||'#b565ff';
      config.bgType=r.bg_type||'solid'; config.bgImageUrl=r.bg_image_url||null;
      config.suporteUrl=r.suporte_url||'#'; config.icons=r.icones||[];
    } catch(e){ console.warn('White label:',e.message); }
    applyWhiteLabel();
  }

  function applyWhiteLabel(){
    const root=document.documentElement;
    root.style.setProperty('--accent', config.colorAccent);
    root.style.setProperty('--accent-rgb', hexToRgb(config.colorAccent));

    // Só sobrescreve o fundo se o revendedor tiver imagem própria configurada
    if(config.bgType==='image' && config.bgImageUrl){
      document.body.style.backgroundImage=`linear-gradient(rgba(0,0,0,.3),rgba(0,0,0,.3)),url(${config.bgImageUrl})`;
      document.body.style.backgroundSize='cover';
      document.body.style.backgroundPosition='center';
      document.body.style.backgroundAttachment='fixed';
    }
    // caso contrário mantém o fundo padrão embutido no CSS

    document.title=`Minha Área — ${config.brandName}`;
    ['login-brand','dash-brand'].forEach(id=>{ const el=document.getElementById(id); if(el) el.textContent=config.brandName; });
    ['login-tagline','dash-tagline'].forEach(id=>{
      const el=document.getElementById(id); if(!el) return;
      el.textContent=config.tagline||'Bem-vindo';
    });

    if(config.logoUrl){
      const loginImg=document.getElementById('login-logo-img');
      const dashImg=document.getElementById('dash-logo-img');
      if(loginImg){ loginImg.src=config.logoUrl; loginImg.style.display='block'; document.getElementById('login-emoji').style.display='none'; }
      if(dashImg){ dashImg.src=config.logoUrl; dashImg.classList.add('visible'); document.getElementById('dash-emoji').style.display='none'; }
    }
    const sl=document.getElementById('suporte-link'); if(sl) sl.href=config.suporteUrl||'#';
  }

  function buildCard(ic){
    const label=ic.label||'';
    const card=document.createElement('div');
    card.className='card';

    const body=document.createElement('div');
    body.className='card-body';

    if(ic.imgUrl){
      const img=document.createElement('img');
      img.className='panel-logo'; img.src=ic.imgUrl; img.alt=label;
      body.appendChild(img);
    } else {
      const letter=document.createElement('span');
      letter.className='panel-letter';
      letter.textContent=(ic.emoji||label[0]||'?').toUpperCase();
      body.appendChild(letter);
    }

    const star=document.createElement('button');
    star.className='star-btn'+(isFav(label)?' fav':'');
    star.textContent=isFav(label)?'★':'☆';
    star.title=isFav(label)?'Remover dos favoritos':'Favoritar';
    star.addEventListener('click',e=>{ e.preventDefault(); e.stopPropagation(); toggleFav(label); });
    body.appendChild(star);

    const footer=document.createElement('div');
    footer.className='card-footer';

    const nameEl=document.createElement('span');
    nameEl.className='name'; nameEl.textContent=label;

    const btn=document.createElement('button');
    btn.className='btn-access'; btn.textContent='ACESSAR';
    btn.addEventListener('click',()=>{ if(ic.url&&ic.url!=='#') window.open(ic.url,'_blank','noopener'); });

    footer.appendChild(nameEl); footer.appendChild(btn);
    card.appendChild(body); card.appendChild(footer);
    return card;
  }

  function renderIcons(){
    const grid=document.getElementById('icons-grid');
    const favGrid=document.getElementById('fav-grid');
    const favSec=document.getElementById('fav-section');
    grid.innerHTML=''; favGrid.innerHTML='';

    if(!config.icons||config.icons.length===0){
      grid.innerHTML='<div class="empty-state"><div class="empty-state-icon">🔲</div>Nenhum acesso disponível ainda.</div>';
      favSec.style.display='none'; return;
    }

    const favs=getFavs();
    const favList=config.icons.filter(ic=>favs.includes(ic.label));
    const rest=config.icons.filter(ic=>!favs.includes(ic.label));

    if(favList.length>0){ favSec.style.display='block'; favList.forEach(ic=>favGrid.appendChild(buildCard(ic))); }
    else favSec.style.display='none';

    if(rest.length>0) rest.forEach(ic=>grid.appendChild(buildCard(ic)));
    else grid.innerHTML='<div class="empty-state"><div class="empty-state-icon">⭐</div>Todos os ícones estão nos favoritos.</div>';
  }

  const btnLogin=document.getElementById('btn-login');
  const inputEmail=document.getElementById('input-email');
  const inputPwd=document.getElementById('input-password');

  async function doLogin(){
    const email=inputEmail.value.trim().toLowerCase();
    const pwd=inputPwd.value;
    const errEl=document.getElementById('login-error');
    if(!email||!pwd){ errEl.textContent='Preencha e-mail e senha.'; errEl.classList.add('visible'); return; }
    errEl.classList.remove('visible');
    btnLogin.disabled=true; btnLogin.textContent='Entrando…';
    try {
      const query=config.revendedorId
        ?`clientes?email=eq.${encodeURIComponent(email)}&revendedor_id=eq.${config.revendedorId}&ativo=eq.true&limit=1`
        :`clientes?email=eq.${encodeURIComponent(email)}&ativo=eq.true&limit=1`;
      const data=await sbFetch(query);
      if(!data||data.length===0) throw new Error('E-mail ou senha incorretos.');
      const cliente=data[0];
      if(cliente.senha&&cliente.senha!==pwd) throw new Error('E-mail ou senha incorretos.');
      sessionStorage.setItem('wl_user',JSON.stringify({email,nome:cliente.nome||email,id:cliente.id}));
      showDashboard(email,cliente.nome);
    } catch(e){
      errEl.textContent=e.message||'Erro ao entrar. Tente novamente.';
      errEl.classList.add('visible');
      btnLogin.disabled=false; btnLogin.textContent='Entrar';
      inputPwd.value=''; inputPwd.focus();
    }
  }

  btnLogin.addEventListener('click',doLogin);
  [inputEmail,inputPwd].forEach(inp=>inp.addEventListener('keydown',e=>{ if(e.key==='Enter') doLogin(); }));

  function showDashboard(email,nome){
    document.getElementById('login-screen').style.display='none';
    document.getElementById('dashboard-screen').classList.add('visible');
    const display=nome||email;
    document.getElementById('dash-user-avatar').textContent=display[0].toUpperCase();
    document.getElementById('dash-user-name').textContent=display;
    renderIcons(); showToast('Bem-vindo! 👋');
  }

  document.getElementById('btn-logout').addEventListener('click',function(){
    sessionStorage.removeItem('wl_user');
    document.getElementById('dashboard-screen').classList.remove('visible');
    document.getElementById('login-screen').style.display='';
    inputEmail.value=''; inputPwd.value='';
    btnLogin.disabled=false; btnLogin.textContent='Entrar';
    document.getElementById('login-error').classList.remove('visible');
    showToast('Sessão encerrada.');
  });

  async function init(){
    await carregarWhiteLabel();
    const saved=sessionStorage.getItem('wl_user');
    if(saved){ try{ const u=JSON.parse(saved); document.getElementById('login-screen').style.display='none'; showDashboard(u.email,u.nome); }catch(e){ sessionStorage.removeItem('wl_user'); } }
    document.getElementById('loading').classList.add('hidden');
    setTimeout(()=>{ const l=document.getElementById('loading'); if(l) l.remove(); },400);
  }

  init();
})();
</script>
</body>
</html>
